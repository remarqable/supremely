[project]
name = "supremely"
version = "0.1.0"
description = "Open-source, multi-tenant platform for publishing, memberships, newsletters, and discussions."
requires-python = ">=3.12"
dependencies = [
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Login",
    "Flask-Migrate",
    "SQLAlchemy",
    "structlog",
    "python-dotenv",
    "gunicorn",
    "Pillow",
    "psycopg[binary]",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/config.py", "*/migrations/*"]
