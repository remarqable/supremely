# Version updates only. Alerts and security updates are repository settings,
# enabled separately, and not controlled by this file.
version: 2

updates:
  # Constraints in pyproject.toml are mostly open, so uv.lock is what these
  # pull requests mostly change.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One pull request a week rather than one per package.
      python:
        patterns: ["*"]

  # The workflow's own actions. Nothing else watches these.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
