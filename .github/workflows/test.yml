name: Tests

# Push is limited to main and tags: a branch with a pull request open would
# otherwise match both events and run everything twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege: these jobs only check out code and run it, so none needs the
# write token the repository hands out by default.
permissions:
  contents: read

# Drop superseded pull request runs. Not on main or a tag, where the run is the
# record that a commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite
            test_database_url: ''
          - name: postgres
            test_database_url: postgresql+psycopg://postgres:postgres@localhost:5432/test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests (${{ matrix.name }})
        env:
          TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        run: uv run pytest -q

      - name: CSS is committed and current
        if: matrix.name == 'sqlite'
        run: make css && git diff --exit-code app/static/css/app.css

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      # Warns rather than fails: an advisory published overnight should not turn
      # an unrelated pull request red. Dev tools are audited too, since they run
      # here even though they never ship.
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt \
            > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --format markdown \
            > /tmp/audit.md 2>&1 || true
          cat /tmp/audit.md
          {
            echo "## Dependency audit"
            echo
            if grep -q 'No known vulnerabilities found' /tmp/audit.md; then
              echo 'No known vulnerabilities in the locked dependencies.'
            else
              echo 'pip-audit reported findings. This step warns and does not'
              echo 'fail the build. Fixes land by updating uv.lock.'
              echo
              cat /tmp/audit.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
