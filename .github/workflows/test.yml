name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite
            test_database_url: ''
          - name: postgres
            test_database_url: postgresql+psycopg://postgres:postgres@localhost:5432/test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests (${{ matrix.name }})
        env:
          TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        run: uv run pytest -q

      - name: CSS is committed and current
        if: matrix.name == 'sqlite'
        run: make css && git diff --exit-code app/static/css/app.css

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      # Warns rather than fails. A dependency publishing an advisory overnight
      # should not turn an unrelated pull request red, and a red build nobody
      # caused is a build people learn to ignore. Findings go to the run
      # summary; Dependabot alerts are the durable record.
      #
      # Audits the locked versions, dev tools included: they do not ship, but
      # they run here on every push, so an advisory against one still matters.
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt \
            > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --format markdown \
            > /tmp/audit.md 2>&1 || true
          cat /tmp/audit.md
          {
            echo "## Dependency audit"
            echo
            if grep -q 'No known vulnerabilities found' /tmp/audit.md; then
              echo 'No known vulnerabilities in the locked dependencies.'
            else
              echo 'pip-audit reported findings. This step warns and does not'
              echo 'fail the build. Fixes land by updating uv.lock.'
              echo
              cat /tmp/audit.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
