{% extends 'setup/_layout.html' %}

{% block setup_content %}
<h1 class="text-xl font-semibold">{{ _('setup.database_title') }}</h1>
<p class="mt-2 text-sm text-slate-600">{{ _('setup.database_body') }}</p>

<form method="POST" class="mt-6 space-y-4"
      x-data="{ engine: '{{ defaults.get('engine', 'sqlite') }}' }">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label class="flex items-center gap-2">
    <input type="radio" name="engine" value="sqlite" x-model="engine">
    <span>{{ _('setup.sqlite_label') }}</span>
  </label>
  <label class="flex items-center gap-2">
    <input type="radio" name="engine" value="postgres" x-model="engine">
    <span>{{ _('setup.postgres_label') }}</span>
  </label>

  <div x-show="engine === 'postgres'" x-cloak class="space-y-4 border-s-2 border-slate-200 ps-4">
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2">
        <label for="host" class="label">{{ _('setup.pg_host') }}</label>
        <input type="text" id="host" name="host" class="input mt-1" value="localhost">
      </div>
      <div>
        <label for="port" class="label">{{ _('setup.pg_port') }}</label>
        <input type="text" id="port" name="port" class="input mt-1" value="5432">
      </div>
    </div>
    <div>
      <label for="dbname" class="label">{{ _('setup.pg_dbname') }}</label>
      <input type="text" id="dbname" name="dbname" class="input mt-1">
    </div>
    <div>
      <label for="username" class="label">{{ _('setup.pg_username') }}</label>
      <input type="text" id="username" name="username" class="input mt-1">
    </div>
    <div>
      <label for="password" class="label">{{ _('setup.pg_password') }}</label>
      <input type="password" id="password" name="password" class="input mt-1">
    </div>
  </div>

  <button type="submit" class="btn-primary w-full">{{ _('common.continue') }}</button>
</form>
{% endblock %}
