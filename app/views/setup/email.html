{% extends 'setup/_layout.html' %}

{% block setup_content %}
<h1 class="text-xl font-semibold">{{ _('setup.email_title') }}</h1>
<p class="mt-2 text-sm text-slate-600">{{ _('setup.email_body') }}</p>

<form method="POST" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div class="grid grid-cols-3 gap-3">
    <div class="col-span-2">
      <label for="smtp_host" class="label">{{ _('admin.smtp_host') }}</label>
      <input type="text" id="smtp_host" name="smtp_host" class="input mt-1"
             value="{{ defaults.get('smtp_host', '') }}">
    </div>
    <div>
      <label for="smtp_port" class="label">{{ _('admin.smtp_port') }}</label>
      <input type="text" id="smtp_port" name="smtp_port" class="input mt-1"
             value="{{ defaults.get('smtp_port', '587') }}">
    </div>
  </div>
  <div>
    <label for="smtp_username" class="label">{{ _('admin.smtp_username') }}</label>
    <input type="text" id="smtp_username" name="smtp_username" class="input mt-1"
           value="{{ defaults.get('smtp_username', '') }}">
  </div>
  <div>
    <label for="smtp_password" class="label">{{ _('admin.smtp_password') }}</label>
    <input type="password" id="smtp_password" name="smtp_password" class="input mt-1">
  </div>
  <div>
    <label for="from_address" class="label">{{ _('admin.from_address') }}</label>
    <input type="email" id="from_address" name="from_address" class="input mt-1"
           value="{{ defaults.get('from_address', '') }}">
  </div>
  <label class="flex items-center gap-2 text-sm">
    <input type="checkbox" name="use_tls" checked>
    {{ _('admin.use_tls') }}
  </label>

  <div class="flex gap-2">
    <button type="submit" class="btn-primary flex-1">{{ _('common.continue') }}</button>
    <button type="submit" name="skip" value="1" class="btn-secondary flex-1">{{ _('common.skip') }}</button>
  </div>
</form>
{% endblock %}
