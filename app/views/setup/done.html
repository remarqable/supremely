{% extends 'setup/_layout.html' %}

{% block setup_content %}
<h1 class="text-2xl font-bold">{{ _('setup.done_title') }}</h1>
<p class="mt-3 text-slate-600">{{ _('setup.done_body') }}</p>

{% if restart_required %}
<div class="mt-4 rounded-md bg-amber-50 p-4 text-sm text-amber-800 ring-1 ring-amber-200">
  {{ _('setup.done_restart') }}
</div>
{% else %}
<div class="mt-8">
  <a href="/" class="btn-primary w-full">{{ _('setup.go_to_app') }}</a>
</div>
{% endif %}
{% endblock %}
