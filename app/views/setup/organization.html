{% extends 'setup/_layout.html' %}

{% block setup_content %}
<h1 class="text-xl font-semibold">{{ _('setup.org_title') }}</h1>
<p class="mt-2 text-sm text-slate-600">{{ _('setup.org_body') }}</p>

<form method="POST" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div>
    <label for="name" class="label">{{ _('orgs.name_label') }}</label>
    <input type="text" id="name" name="name" class="input mt-1" maxlength="100"
           value="{{ defaults.get('name', '') }}">
  </div>

  <div>
    <label for="slug" class="label">{{ _('orgs.slug_label') }}</label>
    <input type="text" id="slug" name="slug" class="input mt-1"
           pattern="[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?"
           value="{{ defaults.get('slug', '') }}">
    <p class="mt-1 text-sm text-slate-600">{{ _('orgs.slug_hint') }}</p>
  </div>

  <div class="flex gap-2">
    <button type="submit" class="btn-primary flex-1">{{ _('setup.create_org') }}</button>
    <button type="submit" name="skip" value="1" class="btn-secondary flex-1"
            formnovalidate>{{ _('common.skip') }}</button>
  </div>
</form>
{% endblock %}
