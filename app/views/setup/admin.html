{% extends 'setup/_layout.html' %}

{% block setup_content %}
<h1 class="text-xl font-semibold">{{ _('setup.admin_title') }}</h1>
<p class="mt-2 text-sm text-slate-600">{{ _('setup.admin_body') }}</p>

<form method="POST" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div>
    <label for="username" class="label">{{ _('setup.admin_username') }}</label>
    <input type="text" id="username" class="input mt-1 bg-slate-50 text-slate-600"
           value="{{ username }}" readonly aria-describedby="username-hint">
    <p id="username-hint" class="mt-1 text-sm text-slate-600">
      {{ _('setup.admin_username_hint') }}
    </p>
  </div>

  <div>
    <label for="password" class="label">{{ _('auth.password_label') }}</label>
    <input type="password" id="password" name="password" class="input mt-1"
           required minlength="8" autocomplete="new-password">
  </div>

  <div>
    <label for="confirm_password" class="label">{{ _('auth.confirm_password') }}</label>
    <input type="password" id="confirm_password" name="confirm_password"
           class="input mt-1" required minlength="8" autocomplete="new-password">
  </div>

  <button type="submit" class="btn-primary w-full">{{ _('common.continue') }}</button>
</form>
{% endblock %}
