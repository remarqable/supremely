{% extends 'admin/_layout.html' %}

{% block admin_content %}
<div class="max-w-xl">
  <div class="card">
    <h3 class="mb-4 text-lg font-semibold">{{ _('admin.general_settings') }}</h3>
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="section" value="general">
      <div>
        <label for="name" class="label">{{ _('admin.installation_name') }}</label>
        <input type="text" id="name" name="name" class="input mt-1"
               value="{{ values.get('installation.name', '') }}">
      </div>
      <div>
        <label for="timezone" class="label">{{ _('admin.timezone') }}</label>
        <input type="text" id="timezone" name="timezone" class="input mt-1"
               value="{{ values.get('installation.timezone', 'UTC') }}">
      </div>
      <div>
        <label for="language" class="label">{{ _('admin.language') }}</label>
        <select id="language" name="language" class="select mt-1">
          {% for code, label in AVAILABLE_LANGUAGES.items() %}
          <option value="{{ code }}" {{ 'selected' if code == values.get('installation.language', 'en') }}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="allow_signups"
               {{ 'checked' if values.get('installation.allow_organization_signups') == 'true' }}>
        {{ _('admin.allow_signups') }}
      </label>
      <button type="submit" class="btn-primary">{{ _('common.save') }}</button>
    </form>
  </div>

</div>
{% endblock %}
