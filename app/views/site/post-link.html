{% extends 'site/post.html' %}

{% block post_body %}
<div class="mb-6 rounded-md bg-slate-50 p-4 ring-1 ring-slate-200">
  <a href="{{ post.fields.url }}" rel="noopener noreferrer"
     class="text-lg font-medium text-brand-600 underline hover:text-brand-700">
    {{ post.fields.url }}</a>
  {% if post.fields.source %}
  <span class="ms-2 text-sm text-slate-500">via {{ post.fields.source }}</span>
  {% endif %}
</div>
<div class="prose-supremely">
  {{ post.html | safe }}
</div>
{% endblock %}
