{% extends site_layout %}

{% block title %}{{ _('newsletter.unsubscribed_title') }} — {{ g.org.name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md py-10">
  <div class="card text-center">
    <h1 class="text-xl font-semibold">{{ _('newsletter.unsubscribed_title') }}</h1>
    <p class="mt-2 text-slate-600">{{ _('newsletter.unsubscribed_body') }}</p>
    <a href="/subscribe" class="btn-secondary mt-6">{{ _('newsletter.resubscribe') }}</a>
  </div>
</div>
{% endblock %}
