{% extends 'layouts/base.html' %}

{% block title %}{{ _('orgs.new_title') }} — {{ installation_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="card">
    <h1 class="text-xl font-semibold">{{ _('orgs.new_title') }}</h1>

    <form method="POST" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="name" class="label">{{ _('orgs.name_label') }}</label>
        <input type="text" id="name" name="name" class="input mt-1" required maxlength="100">
      </div>

      <div>
        <label for="slug" class="label">{{ _('orgs.slug_label') }}</label>
        <input type="text" id="slug" name="slug" class="input mt-1" required
               pattern="[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?">
        <p class="mt-1 text-sm text-slate-600">{{ _('orgs.slug_hint') }}</p>
      </div>

      <div class="flex gap-2">
        <button type="submit" class="btn-primary">{{ _('common.create') }}</button>
        <a href="{{ url_for('orgs.launcher') }}" class="btn-secondary">{{ _('common.cancel') }}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
