{% extends 'layouts/minimal.html' %}

{% block title %}{{ _('auth.login_title') }} — {{ installation_name }}{% endblock %}

{% block content %}
<div class="card">
  <h1 class="text-xl font-semibold">{{ _('auth.login_title') }}</h1>
  <p class="mt-1 text-sm text-slate-600">{{ installation_name }}</p>

  <form method="POST" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

    <div>
      <label for="email" class="label">{{ _('auth.email_label') }}</label>
      <input type="email" id="email" name="email" class="input mt-1" required
             autocomplete="email" autofocus>
    </div>

    <div>
      <label for="password" class="label">{{ _('auth.password_label') }}</label>
      <input type="password" id="password" name="password" class="input mt-1"
             required autocomplete="current-password">
    </div>

    <button type="submit" class="btn-primary w-full">{{ _('auth.login_button') }}</button>
  </form>
</div>
{% endblock %}
