{% extends 'layouts/base.html' %}

{% block title %}{{ _('auth.change_password_title') }} — {{ installation_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="card">
    <h1 class="text-xl font-semibold">{{ _('auth.change_password_title') }}</h1>

    <form method="POST" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="current_password" class="label">{{ _('auth.current_password') }}</label>
        <input type="password" id="current_password" name="current_password"
               class="input mt-1" required autocomplete="current-password">
      </div>

      <div>
        <label for="new_password" class="label">{{ _('auth.new_password') }}</label>
        <input type="password" id="new_password" name="new_password"
               class="input mt-1" required autocomplete="new-password" minlength="8">
      </div>

      <div>
        <label for="confirm_password" class="label">{{ _('auth.confirm_password') }}</label>
        <input type="password" id="confirm_password" name="confirm_password"
               class="input mt-1" required autocomplete="new-password" minlength="8">
      </div>

      <button type="submit" class="btn-primary">{{ _('common.save') }}</button>
    </form>
  </div>
</div>
{% endblock %}
